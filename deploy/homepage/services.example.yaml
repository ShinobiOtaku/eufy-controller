- Home:
    - Eufy Security:
        icon: mdi-shield-home
        href: http://homepage.example/eufy/
        description: Schedule and Away control
        widget:
          type: customapi
          url: http://127.0.0.1:8765/api/homepage
          refreshInterval: 10000
          mappings:
            - field: mode
              label: Status
              format: text
              remap:
                - value: schedule
                  to: Schedule
                - value: away
                  to: Armed
                - any: true
                  to: Unavailable
